<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>10km歩くまで終われまてん</title><style>*{box-sizing:border-box}body{margin:0;background:#120d24;color:white;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;text-align:center;padding:25px 15px}.wrap{max-width:520px;margin:auto}.tag{color:#ffe574;font-weight:800;font-size:clamp(20px,5vw,29px);margin:12px 0 22px}.small{font-size:20px;color:#c9c2e6}.big{font-weight:900;font-size:clamp(65px,17vw,110px);letter-spacing:-3px;line-height:1.2}.unit{font-size:32px}.bar{height:20px;border-radius:20px;background:#342a4e;overflow:hidden;margin:22px 0 12px}.fill{height:100%;width:0;background:linear-gradient(90deg,#4de1c1,#7a9cff);transition:width .5s}.stats{display:flex;justify-content:space-between;color:#dcd7f0;font-size:16px}.status{margin:20px 0;color:#a9a3c1;font-size:14px;min-height:20px}button{border:0;border-radius:13px;padding:15px;font-size:17px;font-weight:700;color:white;background:#6252e5;cursor:pointer}button:disabled{opacity:.5}.primary{width:100%;margin:8px 0}.row{display:flex;gap:8px;margin:10px 0}.row button{flex:1}.add{background:#159a86}.subtract{background:#bc5973}.muted{background:#393251}.note{font-size:13px;color:#ada6c6;line-height:1.6}.setting{margin-top:18px;padding:14px;border:1px solid #403655;border-radius:15px}input{width:90px;background:#302941;color:white;border:1px solid #766b94;border-radius:8px;padding:9px;font-size:18px;text-align:center}label{font-size:14px}#done{display:none;color:#ffe574;font-size:28px;font-weight:900;margin-top:15px}</style></head><body><div class="wrap"><div class="tag">🚶 10,000m歩くまで終われまてん！</div><div class="small">残りの距離</div><div class="big"><span id="remaining">10,000</span><span class="unit">m</span></div><div class="bar"><div id="fill" class="fill"></div></div><div class="stats"><span>進んだ距離 <b id="travel">0m</b></span><span id="pct">0.0%</span></div><div id="done">🎉 10km達成！</div><div id="status" class="status">開始ボタンでGPS計測</div><button id="start" class="primary">▶ GPS計測を開始</button><button id="pause" class="primary muted" disabled>⏸ 一時停止</button><div class="setting"><div style="font-weight:700;margin-bottom:8px">🎁 ギフトなどで距離を増やす</div><div class="row"><button class="add" data-delta="100">残り +100m</button><button class="add" data-delta="500">残り +500m</button></div><div class="row"><button class="add" data-delta="1000">残り +1,000m</button><button class="subtract" data-delta="-100">残り −100m</button></div><div class="row" style="align-items:center;justify-content:center"><label>自由入力 <input id="custom" type="number" min="1" step="1" value="100"> m</label></div><div class="row"><button id="customAdd" class="add">残りを増やす</button><button id="customSubtract" class="subtract">残りを減らす</button></div></div><button id="reset" class="primary muted">↺ 全部リセット</button><p class="note">GPSで移動距離を計測します。画面を開いたまま使用してください。iPhoneの画面ロック・バックグラウンドでは計測が止まる場合があります。GPS誤差を減らすため、精度の悪い位置情報や不自然な移動は無視します。ヘルスケアの歩数データではありません。</p></div><script>
const GOAL=10000;const key='gps10km-counter-v1';let data={distance:0,bonus:0},watch=null,last=null,lastTime=0,starting=false;try{const s=JSON.parse(localStorage.getItem(key));if(s&&Number.isFinite(s.distance)&&Number.isFinite(s.bonus))data=s}catch(e){}const $=id=>document.getElementById(id);const fmt=n=>Math.round(n).toLocaleString('ja-JP');function render(){const remaining=Math.max(0,GOAL-data.distance+data.bonus);$('remaining').textContent=fmt(remaining);$('travel').textContent=fmt(data.distance)+'m';const percent=Math.min(100,Math.max(0,100*(GOAL-remaining)/GOAL));$('pct').textContent=percent.toFixed(1)+'%';$('fill').style.width=percent+'%';$('done').style.display=remaining<=0?'block':'none';localStorage.setItem(key,JSON.stringify(data))}function status(t){$('status').textContent=t}function rad(x){return x*Math.PI/180}function hav(a,b){const R=6371000,dlat=rad(b.latitude-a.latitude),dlon=rad(b.longitude-a.longitude),v=Math.sin(dlat/2)**2+Math.cos(rad(a.latitude))*Math.cos(rad(b.latitude))*Math.sin(dlon/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(v)))}function update(p){const c=p.coords,now=p.timestamp||Date.now();if(!Number.isFinite(c.accuracy)||c.accuracy>35){status('GPS精度が低いため待機中（誤差 '+Math.round(c.accuracy||0)+'m）');return}const point={latitude:c.latitude,longitude:c.longitude};if(last){const meters=hav(last,point),secs=(now-lastTime)/1000;if(meters>=3&&meters<=80&&secs>0&&meters/secs<=3.5){data.distance+=meters;last=point;lastTime=now;render();status('計測中 ● GPS誤差 約'+Math.round(c.accuracy)+'m');return}if(meters>80||secs>90){last=point;lastTime=now;status('GPS位置を再調整しました');return}}else{last=point;lastTime=now;status('GPS計測中 ● 歩き始めてください')}}function fail(e){status('位置情報を取得できません：'+e.message);stop()}function stop(){if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;last=null;lastTime=0;$('start').disabled=false;$('pause').disabled=true;$('start').textContent='▶ GPS計測を再開'}$('start').onclick=()=>{if(!navigator.geolocation){status('このブラウザはGPSに対応していません');return}if(!window.isSecureContext){status('GPS利用にはHTTPSのWebページで開く必要があります');return}last=null;lastTime=0;$('start').disabled=true;$('pause').disabled=false;status('GPS位置情報を取得しています…');watch=navigator.geolocation.watchPosition(update,fail,{enableHighAccuracy:true,maximumAge:0,timeout:20000})};$('pause').onclick=()=>{stop();status('一時停止中')};document.querySelectorAll('[data-delta]').forEach(b=>b.onclick=()=>{data.bonus+=Number(b.dataset.delta);render()});$('customAdd').onclick=()=>change(1);$('customSubtract').onclick=()=>change(-1);function change(sign){const n=Number($('custom').value);if(!Number.isFinite(n)||n<=0)return;data.bonus+=sign*n;render()}$('reset').onclick=()=>{if(confirm('距離と追加分をすべてリセットしますか？')){stop();data={distance:0,bonus:0};render();status('リセットしました')}};render();
</script></body></html>
